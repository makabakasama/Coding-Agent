<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Coding Agent · 工作台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside>
    <a class="brand" href="#chat"><span class="logo">C</span> Coding Agent <small>V0.6</small></a>
    <div class="workspace">本地工作空间<br><strong>开发工作台</strong></div>
    <nav aria-label="主要导航" hidden>
      <a href="#chat">Chat</a>
      <a href="#task">新建编码任务</a>
      <a href="#tasks">普通任务记录</a>
      <a href="#projects">项目实验历史</a>
      <a href="#history">演示记录</a>
    </nav>
    <div class="aside-bottom"><span class="dot"></span> <span id="workbench-mode">本地工作台</span></div>
  </aside>
  <main>
    <header>
      <span id="breadcrumb">工作台</span>
      <div class="actions">
        <span id="account-alert" role="alert"></span>
        <span id="account-label" class="badge"></span>
        <button id="account-logout" type="button" class="secondary" hidden>退出</button>
      </div>
    </header>
    <div id="app"></div>
    <footer>模型回复、执行状态与检查结果分别记录。</footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
